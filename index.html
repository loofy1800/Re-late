<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2B1810">
  <meta name="description" content="Explore a local demo of group car-buying coordination with Relate.">
  <title>Relate — Group Car Buying</title>
  <link rel="icon" href="assets/relate-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="relate-header">
    <div class="header-inner">
      <a class="logo-container" href="/" data-nav-view="browse" aria-label="Relate home">
        <img class="header-logo" src="assets/relate-header-logo.webp" alt="Relate Group Car Buying" width="900" height="339" decoding="async">
      </a>

      <label class="header-location-pill">
        <span aria-hidden="true">📍</span>
        <select id="header-location-select" aria-label="Filter by metro">
          <option value="all">All metros</option>
          <option value="Atlanta, GA">Atlanta, GA</option>
          <option value="Dallas-Fort Worth, TX">Dallas-Fort Worth, TX</option>
          <option value="Austin, TX">Austin, TX</option>
          <option value="Los Angeles, CA">Los Angeles, CA</option>
          <option value="Chicago, IL">Chicago, IL</option>
          <option value="Charlotte, NC">Charlotte, NC</option>
          <option value="Miami, FL">Miami, FL</option>
          <option value="San Francisco, CA">San Francisco, CA</option>
        </select>
      </label>

      <label class="header-search-wrap">
        <span class="header-search-icon" aria-hidden="true">⌕</span>
        <input id="header-search-input" class="header-search-input" type="search" placeholder="Search vehicles, groups, dealers..." aria-label="Search groups">
      </label>

      <nav class="header-nav-links" aria-label="Main navigation">
        <a class="nav-link-btn active" href="#" data-nav-view="browse">Browse Deals</a>
        <a class="nav-link-btn" href="#" data-nav-view="my-groups">My Groups</a>
        <a class="nav-link-btn" href="#" data-nav-view="how-it-works">How It Works</a>
        <a class="nav-link-btn dealer-portal-link" href="#" data-nav-view="dealer-portal">Dealer Portal</a>
      </nav>

      <div class="header-actions-cluster">
        <button type="button" class="icon-btn-3d" id="btn-toggle-sound" aria-label="Toggle tactile audio"></button>
        <button type="button" class="user-profile-badge-btn" data-trigger-auth="profile" aria-label="Edit buyer profile">
          <img id="header-user-avatar" class="user-nav-avatar" src="assets/relate-icon.svg" alt="">
          <span class="user-nav-info">
            <span class="user-nav-name" id="header-user-name"></span>
            <span class="user-nav-badge" id="header-user-badge"></span>
          </span>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content-area" class="app-main-layout" tabindex="-1"></main>

  <footer class="relate-footer">
    <div class="footer-inner">
      <div class="footer-bottom-bar">
        <span>Relate is a local demo. Offers, verification, authentication and dealership communications are simulated.</span>
        <span>© Relate Group Car Buying</span>
      </div>
    </div>
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
